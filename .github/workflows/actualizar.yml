name: Actualizador de Payloads

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  generar-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar mi repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow (para redimensionar iconos)
        run: pip install pillow

      - name: Ejecutar el script buscador
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python actualizador.py

      - name: Guardar los cambios (Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
            exit 0
          fi
          git commit -m "Actualizados payloads e iconos"
          # GitHub a veces rechaza el push con un error temporal ('fatal error in
          # commit_refs') o porque el remoto avanzó. Reintentamos con rebase.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (intento $intento)."
              exit 0
            fi
            echo "Push falló (intento $intento); rebase y reintento..."
            git pull --rebase --autostash origin main || true
            sleep $((intento * 5))
          done
          echo "No se pudo hacer push tras varios intentos."
          exit 1
