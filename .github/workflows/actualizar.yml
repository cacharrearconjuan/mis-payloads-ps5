name: Actualizador de Payloads

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  generar-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Descargar mi repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar el script buscador
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <-- Le pasa el token al script
        run: python actualizador.py

      - name: Guardar los cambios (Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add payloads.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualizados payloads [skip ci]"
            git push
          else
            echo "No hay actualizaciones nuevas, no hace falta guardar nada."
          fi
